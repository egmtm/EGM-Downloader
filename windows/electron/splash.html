<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1120;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e2e8f6; overflow: hidden;
        }
        .logo {
            width: 120px; height: 120px; margin-bottom: 30px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            object-fit: cover;
        }
        .title { font-size: 28px; font-weight: 600; margin-bottom: 36px; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            font-size: 13px; color: #94a3b8;
            display: inline-flex; align-items: baseline; gap: 1px;
        }
        .status .dot {
            display: inline-block;
            opacity: 0.3;
            animation: pulse 1.4s infinite ease-in-out;
        }
        .status .dot:nth-child(2) { animation-delay: 0s; }
        .status .dot:nth-child(3) { animation-delay: 0.2s; }
        .status .dot:nth-child(4) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>
    <img class="logo" src="../static/icon-128.png" alt="EGM">
    <div class="title">EGM Downloader</div>
    <div class="spinner"></div>
    <div class="status">Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</body>
</html>
