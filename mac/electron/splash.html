<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1120;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e2e8f6; overflow: hidden;
        }
        .logo {
            width: 120px; height: 120px; margin-bottom: 30px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            object-fit: cover;
        }
        .title { margin-bottom: 36px; text-align: center; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status {
            font-size: 13px; color: #94a3b8;
            display: inline-flex; align-items: baseline; gap: 1px;
        }
        .status .dot {
            display: inline-block;
            opacity: 0.3;
            animation: pulse 1.4s infinite ease-in-out;
        }
        .status .dot:nth-child(2) { animation-delay: 0s; }
        .status .dot:nth-child(3) { animation-delay: 0.2s; }
        .status .dot:nth-child(4) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>
    <img class="logo" src="../app/static/icon-128.png" alt="EGM">
    <div class="title">
      <svg viewBox="0 0 320 30" xmlns="http://www.w3.org/2000/svg" width="320" height="30" role="img" aria-label="EGM Downloader">
        <text x="0" y="18" fill="#3b82f6" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="8">EGM</text>
        <text x="105" y="18" fill="#e2e8f6" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="200" letter-spacing="3">DOWNLOADER</text>
        <line x1="0" y1="26" x2="320" y2="26" stroke="#94a3b8" stroke-width=".5" stroke-opacity=".4"/>
      </svg>
    </div>
    <div class="spinner"></div>
    <div class="status">Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</body>
</html>
