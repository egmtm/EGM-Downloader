<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1120;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #e2e8f6; overflow: hidden;
        }
        .logo {
            width: 120px; height: 120px; margin-bottom: 30px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            object-fit: cover;
        }
        .title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 40px; }
        .progress-container {
            width: 280px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%; border-radius: 2px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            transition: width 0.3s ease;
            position: relative; overflow: hidden;
        }
        .progress-bar::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 1.5s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .status {
            margin-top: 16px; font-size: 12px; color: #64748b;
            transition: color 0.3s ease;
        }
        .status.active { color: #94a3b8; }
    </style>
</head>
<body>
    <img class="logo" src="../app/static/icon-128.png" alt="EGM">
    <div class="title">EGM Downloader</div>
    <div class="subtitle">Loading application...</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status active" id="status">Starting up...</div>
</body>
</html>
