<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
/* Splash window: 500x350, frameless and transparent (see createSplash in main.js).
   The card is inset so its shadow fits inside the window. Only transforms and opacity move. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: transparent; }
body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f6;
}
.card {
    position: relative; width: 468px; height: 318px; border-radius: 24px; overflow: hidden;
    background: #0b1120;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px rgba(148,163,184,.16) inset, 0 4px 14px rgba(0,0,0,.5);
    transition: opacity .28s ease, transform .28s ease;
}
body.out .card { opacity: 0; transform: scale(.975); }
.card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.045), transparent 38%); }
.glow { position: absolute; pointer-events: none; }
.glow.g1 { width: 380px; height: 380px; left: -100px; top: -160px; background: radial-gradient(circle, rgba(59,130,246,.34), transparent 62%); animation: drift1 12s ease-in-out infinite alternate; }
.glow.g2 { width: 340px; height: 340px; right: -120px; bottom: -180px; background: radial-gradient(circle, rgba(184,119,25,.24), transparent 62%); animation: drift2 15s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(80px, 54px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-90px, -44px) scale(1.1); } }

/* mark: the app icon redrawn as vector, sharp on any screen */
.mark { position: relative; width: 128px; height: 124px; }
.halo { position: absolute; inset: -26px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,.42) 0, rgba(59,130,246,.12) 45%, transparent 68%); animation: breathe 3.4s ease-in-out infinite; }
.mark .hv { position: relative; display: block; width: 128px; height: 124px; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
.hv .ray { animation: ray 2.8s ease-in-out infinite; }
.hv .ring { transform-origin: 256px 230px; transform-box: view-box; animation: spin 40s linear infinite; }
.hv .arrow { animation: nudge 2.2s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .6; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes ray { 0%,100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * 2.1); } }
@keyframes nudge { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(11px); opacity: .7; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* wordmark: drawn as outlines, so it looks the same on every platform */
.title { position: relative; margin-top: 18px; animation: rise .6s .15s cubic-bezier(.2,.8,.2,1) both; }
.title svg { display: block; }
.shine { transform-box: fill-box; animation: shinemove 3.4s ease-in-out infinite; }
@keyframes shinemove { 0%,25% { transform: translateX(0) skewX(-18deg); } 100% { transform: translateX(470px) skewX(-18deg); } }

/* progress bar: the fill eases toward the last reported target, so it never looks frozen */
.bar { position: relative; width: 240px; height: 4px; border-radius: 2px; margin: 26px 0 14px; overflow: hidden; background: rgba(255,255,255,.08); animation: rise .6s .3s cubic-bezier(.2,.8,.2,1) both; }
.bar i { position: absolute; inset: 0; border-radius: 2px; background: linear-gradient(90deg, #3b82f6, #7fb0ff); transform: scaleX(0); transform-origin: 0 50%; transition: transform 4s cubic-bezier(.1,.7,.2,1); }
.bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); animation: shine 1.6s ease-in-out infinite; }
@keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

.status { position: relative; font-size: 12.5px; letter-spacing: .02em; color: #94a3b8; display: inline-flex; align-items: baseline; gap: 1px; animation: rise .6s .3s cubic-bezier(.2,.8,.2,1) both; }
.status .dot { display: inline-block; opacity: .3; animation: pulse 1.4s infinite ease-in-out; }
.status .dot:nth-child(2) { animation-delay: 0s; }
.status .dot:nth-child(3) { animation-delay: .2s; }
.status .dot:nth-child(4) { animation-delay: .4s; }
@keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

/* Reduced motion: nothing moves. The bar still jumps to each reported step (inline transition
   included, hence !important) and the card simply disappears instead of fading. */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
  // Standalone splash window: it loads before Flask starts, so the app's normal i18n
  // (which depends on Flask serving pages) is not available here. main.js reads the saved
  // language setting directly and passes it as ?lang=. These translations are not
  // translator reviewed, just the common, low ambiguity word "Loading".
  (function () {
    var LOADING_WORD = {
      en: 'Loading', ar: 'جارٍ التحميل', de: 'Wird geladen', es: 'Cargando',
      fr: 'Chargement', it: 'Caricamento', ja: '読み込み中', nl: 'Laden',
      pt: 'Carregando', ru: 'Загрузка'
    };
    var lang = new URLSearchParams(location.search).get('lang') || 'en';
    var word = Object.prototype.hasOwnProperty.call(LOADING_WORD, lang) ? LOADING_WORD[lang] : LOADING_WORD.en;
    document.getElementById('status-text').innerHTML = word + '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';

    var fill = document.querySelector('.bar i');
    var reported = false;
    function setBar(percent, seconds) {
      fill.style.transition = 'transform ' + (seconds || 4) + 's cubic-bezier(.1,.7,.2,1)';
      fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, percent / 100)) + ')';
    }
    // Called by main.js as real start up steps finish: a target percent and how many seconds the bar may take to reach it.
    window.setSplashProgress = function (percent, seconds) { reported = true; setBar(percent, seconds); };
    // Called by main.js just before the window closes.
    window.splashOut = function () { document.body.classList.add('out'); };

    void fill.offsetWidth;   // commit the empty state so the first move animates
    setBar(8, 0.5);
    // If the app reports nothing, the bar still moves: a slow ease toward the middle.
    setTimeout(function () { if (!reported) setBar(45, 14); }, 900);
  })();
</script>
