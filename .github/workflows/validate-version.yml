name: Validate Version Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-version-sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run version validation
      run: python scripts/validate-version-sync.py
      
    - name: Report success
      if: success()
      run: echo "✅ All version strings are synchronized"
