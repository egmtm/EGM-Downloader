name: Validate Version Sync

# Triggers only on changes to files the validator actually checks.
# Skips noise from STATE.md, README.md, CREDITS.md, .github/, etc.
# IMPORTANT: linux/templates/** and linux/requirements.txt MUST be included
# to preserve the drift guard (added 2026-04-28).

on:
  push:
    branches: [ main, "testing/**", "themes/**" ]
    paths:
      - 'version.json'
      - '**/package.json'
      - '**/app.py'
      - '**/templates/**'
      - 'requirements.txt'
      - 'linux/INSTRUCTIONS.txt'
      - 'linux/requirements.txt'
      - 'mac/BUILD.sh'
      - 'windows/BUILD.sh'
      - 'windows/setup.nsi'
      - 'scripts/validate-version-sync.py'
  pull_request:
    branches: [ main, "testing/**", "themes/**" ]
    paths:
      - 'version.json'
      - '**/package.json'
      - '**/app.py'
      - '**/templates/**'
      - 'requirements.txt'
      - 'linux/INSTRUCTIONS.txt'
      - 'linux/requirements.txt'
      - 'mac/BUILD.sh'
      - 'windows/BUILD.sh'
      - 'windows/setup.nsi'
      - 'scripts/validate-version-sync.py'

jobs:
  check-version-sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Run version validation
      run: python scripts/validate-version-sync.py
      
    - name: Report success
      if: success()
      run: echo "✅ All version strings are synchronized"
