name: Greet First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greet:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      
    steps:
    - name: Greet first-time contributor
      uses: actions/first-interaction@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          👋 **Welcome to EGM Downloader!**
          
          Thank you for opening your first issue! We appreciate you taking the time to help improve the project.
          
          A maintainer will review your issue soon. In the meantime:
          - Check out our [Contributing Guidelines](https://github.com/egmtm/EGM-Downloader/blob/main/CONTRIBUTING.md)
          - Make sure you've provided all the requested information
          - Feel free to add more details if needed
          
          Thanks for being part of the community! 🎉
          
        pr-message: |
          👋 **Welcome to EGM Downloader!**
          
          Thank you for opening your first pull request! We're excited to review your contribution.
          
          Before we can merge:
          - ✅ Make sure you've read our [Contributing Guidelines](https://github.com/egmtm/EGM-Downloader/blob/main/CONTRIBUTING.md)
          - ✅ Ensure all checks pass
          - ✅ Include test results in your PR description
          - ✅ Keep your branch up to date with main
          
          A maintainer will review your PR soon. Thank you for contributing! 🚀
