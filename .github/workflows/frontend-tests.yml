name: Frontend Tests

on:
  push:
    branches: ["main", "testing/**"]
    paths:
      - "templates/**"
      - "languages/**"
      - "app.py"
      - "tests/frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "templates/**"
      - "languages/**"
      - "app.py"
      - "tests/frontend/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install flask

      - name: Install frontend test deps
        working-directory: tests/frontend
        run: npm install --no-audit --no-fund

      - name: Render page
        working-directory: tests/frontend
        run: python render_page.py /tmp/egm_rendered_index.html

      - name: Run jsdom regression tests
        working-directory: tests/frontend
        run: node --test
