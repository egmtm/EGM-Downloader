name: Tests

on:
  push:
    branches: [main, "testing/**", "themes/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flask mutagen cryptography pytest

      - name: Lint CSS — --muted discipline
        run: bash scripts/lint-css-muted.sh

      - name: Run tests
        run: |
          cd tests
          python -m pytest -v --tb=short
        env:
          EGM_API_TOKEN: ci-test-token-not-secret
