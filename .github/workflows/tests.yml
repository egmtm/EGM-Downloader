name: Tests

on:
  push:
    branches: [main, "testing/**", "themes/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flask mutagen cryptography pytest

      - name: Run tests
        run: |
          cd tests
          python -m pytest test_parity.py test_security.py -v --tb=short
        env:
          EGM_API_TOKEN: ci-test-token-not-secret
