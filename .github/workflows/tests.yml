name: Tests

on:
  push:
    branches: [main, "testing/**", "themes/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flask mutagen cryptography pytest

      - name: Run tests
        run: |
          cd tests
          python -m pytest test_parity.py test_security.py -v --tb=short
        env:
          EGM_API_TOKEN: ci-test-token-not-secret
