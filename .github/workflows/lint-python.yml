name: Lint Python

on:
  push:
    branches: [ main, testing/* ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'linux/requirements.txt'
  pull_request:
    branches: [ main, testing/* ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'linux/requirements.txt'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 isort
        
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude='*/electron/dist/*,linux/python/*'
        # Exit-zero treats all errors as warnings
        # E501: line too long (100 chars)
        # W503: line break before binary operator (black style)
        flake8 . --count --exit-zero --max-line-length=100 --ignore=W503 --statistics --exclude='*/electron/dist/*,linux/python/*'
        
    - name: Check import sorting
      run: |
        isort --check-only --diff app.py linux/app.py scripts/ || true
        echo "Note: import order suggestions above are informational only"
