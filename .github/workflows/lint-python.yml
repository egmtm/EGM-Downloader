name: Lint Python

on:
  push:
    branches: [ main, testing/* ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'linux/requirements.txt'
  pull_request:
    branches: [ main, testing/* ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'linux/requirements.txt'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 isort
        
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude='*/electron/dist/*,linux/python/*'
        # Exit-zero treats all errors as warnings
        # E501: line too long (100 chars)
        # W503: line break before binary operator (black style)
        flake8 . --count --exit-zero --max-line-length=100 --ignore=W503 --statistics --exclude='*/electron/dist/*,linux/python/*'
        
    - name: Check import sorting
      run: |
        isort --check-only --diff app.py linux/app.py scripts/ || true
        echo "Note: import order suggestions above are informational only"
