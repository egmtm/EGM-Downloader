name: Lint JavaScript

# POLICY: Informational lint only.
# ESLint runs with `|| true` so the workflow always succeeds regardless
# of lint findings. The badge stays green; lint output is advisory and
# surfaces in the workflow logs for manual review.
# Decision rationale: solo dev workflow, avoid blocking CI on subjective
# style preferences. To switch to lint-blocking, remove `|| true` from
# each eslint command below.

on:
  push:
    branches: [ main, testing/* ]
    paths:
      - 'templates/**.html'
      - 'linux/templates/**.html'
      - '**/electron/*.js'
  pull_request:
    branches: [ main, testing/* ]
    paths:
      - 'templates/**.html'
      - 'linux/templates/**.html'
      - '**/electron/*.js'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
        
    - name: Install ESLint
      run: |
        npm install -g eslint
        
    - name: Lint Electron JavaScript
      run: |
        # Lint electron main process files
        # --quiet suppresses style warnings; only critical errors surface
        eslint --quiet windows/electron/main.js windows/electron/preload.js || true
        eslint --quiet mac/electron/main.js mac/electron/preload.js || true
        eslint --quiet linux/electron/main.js linux/electron/preload.js || true
        echo ""
        echo "Note: ESLint suggestions above are informational only"
        echo "Manual review recommended for HTML-embedded JavaScript"
