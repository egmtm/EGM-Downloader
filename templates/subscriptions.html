<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Subscriptions — EGM Downloader</title>
  <style>
    * { margin:0;padding:0;box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden; }

    ::-webkit-scrollbar { width:8px;height:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border2);border-radius:4px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--text2); }

    /* ── Sidebar ── */
    .sidebar {
      width:180px;background:var(--surf);border-right:1px solid var(--border);
      display:flex;flex-direction:column;transition:width .2s ease;overflow:hidden;
    }
    .sidebar.collapsed { width:40px; }

    .sidebar-header {
      padding:10px;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--border);min-height:42px;
    }
    .sidebar-title { font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden; }
    .sidebar.collapsed .sidebar-title { display:none; }

    .collapse-btn {
      background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;
      padding:4px;border-radius:4px;flex-shrink:0;
    }
    .collapse-btn:hover { color:var(--acc); }

    .sub-list { flex:1;overflow-y:auto;padding:4px 0; }
    .sidebar.collapsed .sub-list { display:none; }
    .mini-list { display:none;flex-direction:column;align-items:center;gap:6px;padding:6px 0;overflow-y:auto; }
    .sidebar.collapsed .mini-list { display:flex; }
    .mini-thumb {
      width:28px;height:28px;border-radius:50%;background:var(--surf2);
      cursor:pointer;border:2px solid transparent;overflow:hidden;
      display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text2);
      flex-shrink:0;background-size:cover;background-position:center;
    }
    .mini-thumb:hover { border-color:var(--acc); }
    .mini-thumb.active { border-color:var(--acc); }

    .sub-item {
      padding:8px 10px;font-size:.72rem;color:var(--text2);cursor:pointer;
      border-left:2px solid transparent;transition:all .1s;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .sub-item:hover { color:var(--text);background:var(--surf2); }
    .sub-item.active { color:var(--acc);border-left-color:var(--acc);background:var(--surf2); }

    .sidebar-footer {
      padding:8px 10px;border-top:1px solid var(--border);
      display:flex;flex-direction:column;gap:6px;
    }
    .sidebar.collapsed .sidebar-footer { display:none; }

    .sidebar-footer button {
      background:none;border:1px solid var(--border);color:var(--text2);
      padding:8px 12px;border-radius:5px;cursor:pointer;font-size:.78rem;
      text-align:center;font-weight:500;
    }
    .sidebar-footer button:hover { border-color:var(--acc);color:var(--acc); }

    /* ── Add subscription bar ── */
    .add-bar {
      padding:8px 10px;border-bottom:1px solid var(--border);
    }
    .sidebar.collapsed .add-bar { display:none; }
    .add-bar input {
      width:100%;padding:5px 8px;font-size:.7rem;
      background:var(--surf2);border:1px solid var(--border);border-radius:4px;
      color:var(--text);outline:none;
    }
    .add-bar input:focus { border-color:var(--acc); }
    .add-bar input::placeholder { color:var(--text2);opacity:0.5; }

    /* ── Detail pane ── */
    .detail {
      flex:1;display:flex;flex-direction:column;overflow:hidden;
    }

    .detail-empty {
      flex:1;display:flex;align-items:center;justify-content:center;
      color:var(--text2);font-size:.8rem;
    }

    .channel-header {
      padding:14px 18px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:12px;
    }
    .channel-thumb {
      width:48px;height:48px;border-radius:8px;background:var(--surf2);
      display:flex;align-items:center;justify-content:center;font-size:24px;
    }
    .channel-info h2 { font-size:.9rem;font-weight:600; }
    .channel-info p { font-size:.68rem;color:var(--text2);margin-top:2px; }

    .video-list { flex:1;overflow-y:auto;padding:8px 18px; }

    .empty-state {
      text-align:center;padding:40px;color:var(--text2);font-size:.75rem;
    }

    /* ── Video cards ── */
    .video-card {
      display:flex;gap:10px;padding:8px;border-radius:6px;
      transition:background .1s;cursor:default;align-items:center;
    }
    .video-card:hover { background:var(--surf2); }
    .video-check {
      width:16px;height:16px;flex-shrink:0;cursor:pointer;
      accent-color:var(--acc);
    }
    .video-card.checked { background:var(--surf2); }

    .dl-bar {
      display:flex;align-items:center;gap:8px;padding:6px 18px;
      border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:2;background:var(--bg);
      margin:-8px -18px 0;
    }
    .dl-bar-btn {
      padding:4px 12px;border-radius:4px;font-size:.65rem;cursor:pointer;
      border:1px solid var(--acc);background:var(--acc);color:var(--btn-on-accent, #fff);
      font-family:inherit;font-weight:500;
    }
    .dl-bar-btn:disabled { opacity:.4;cursor:default; }
    .dl-bar-btn.outline {
      background:transparent;color:var(--text2);border-color:var(--border);
    }
    .video-progress {
      display:flex;align-items:center;gap:6px;margin-top:3px;font-size:.55rem;color:var(--text2);
    }
    .video-progress-bar {
      flex:1;height:4px;background:var(--surf2);border-radius:2px;overflow:hidden;
    }
    .video-progress-fill {
      height:100%;background:var(--acc);border-radius:2px;transition:width .3s;
    }
    .video-status {
      font-size:.55rem;font-weight:500;padding:1px 6px;border-radius:3px;white-space:nowrap;
    }
    .video-status.queued { color:var(--yellow);background:rgba(245,158,11,.1); }
    .video-status.downloading { color:var(--acc);background:rgba(45,212,191,.1); }
    .video-status.done { color:var(--green);background:rgba(34,197,94,.1); }
    .video-status.error { color:var(--red);background:rgba(248,113,113,.1); }
    .video-action-btn {
      background:none;border:1px solid var(--border);border-radius:3px;
      color:var(--text2);font-size:.5rem;padding:1px 6px;cursor:pointer;
      font-family:inherit;white-space:nowrap;
    }
    .video-action-btn:hover { border-color:var(--acc);color:var(--text); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .video-thumb {
      width:160px;height:90px;border-radius:4px;background:var(--surf2);
      flex-shrink:0;display:flex;align-items:center;justify-content:center;
      font-size:20px;color:var(--text2);position:relative;overflow:hidden;
      background-size:cover;background-position:center;
    }
    .video-duration {
      position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.8);
      color:#fff;font-size:.55rem;padding:1px 4px;border-radius:2px;
    }

    .video-info { flex:1;min-width:0; }
    .video-title {
      font-size:.8rem;font-weight:500;color:var(--text);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .video-meta { font-size:.68rem;color:var(--text2);margin-top:3px; }

    .fetch-btn {
      background:var(--surf2);border:1px solid var(--border);color:var(--text2);
      padding:3px 10px;border-radius:3px;cursor:pointer;font-size:.65rem;
    }
    .fetch-btn:hover { border-color:var(--acc);color:var(--acc); }

    {% include 'theme_styles.html' %}
  </style>
</head>
<body class="void">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Subscriptions</span>
      <button class="collapse-btn" id="collapse-btn" title="Toggle sidebar">☰</button>
    </div>

    <div class="add-bar">
      <input type="text" id="add-url" placeholder="Paste URL here..." />
      <div style="display:flex;gap:4px;margin-top:4px">
        <button id="paste-btn" style="flex:1;background:var(--surf2);border:1px solid var(--border);color:var(--text2);padding:4px;border-radius:3px;cursor:pointer;font-size:.65rem" title="Paste from clipboard">📋 Paste</button>
        <button id="add-btn" style="flex:1;background:var(--surf2);border:1px solid var(--acc);color:var(--acc);padding:4px;border-radius:3px;cursor:pointer;font-size:.65rem" title="Add subscription">+ Add</button>
      </div>
    </div>

    <div class="sub-list" id="sub-list"></div>
    <div class="mini-list" id="mini-list"></div>

    <div class="sidebar-footer">
      <button id="history-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M12 8l0 4l2 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>
        Download History
      </button>
      <button id="back-btn">← Back to app</button>
    </div>
  </div>

  <div class="detail" id="detail">
    <div class="detail-empty" id="empty-state">
      <div>
        <div style="font-size:2rem;margin-bottom:8px">📡</div>
        <div>Add a channel or playlist URL to get started</div>
      </div>
    </div>
  </div>

<script>
{% raw %}
// ── Theme support — read active theme from localStorage and apply ────────────
function applyBodyTheme(name) {
  if (name && /^[a-z0-9-]+$/.test(name)) {
    document.body.className = name;
  }
}
applyBodyTheme(localStorage.getItem('egm-theme') || 'void');

// Listen for theme changes from main window
if (window.electronAPI && window.electronAPI.onThemeChanged) {
  window.electronAPI.onThemeChanged((theme) => {
    if (theme) {
      localStorage.setItem('egm-theme', theme);
      applyBodyTheme(theme);
    }
  });
}

// ── API token interceptor ────────────────────────────────────────────────────
(function() {
  const _t = '{% endraw %}{{ egm_token }}{% raw %}';
  const _f = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === 'string' && url.startsWith('/api/') && _t) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { 'X-EGM-Token': _t });
    }
    return _f.call(this, url, opts);
  };
})();

let subs = [];
let activeSub = null;

// ── HTML escape — prevents stored XSS from user-controlled data ──────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── Attribute-context escape — esc() does not escape quotes, which is enough
// for text nodes but NOT for `attr="${...}"` interpolations (a `"` would
// terminate the attribute). Escapes &, <, >, " and '.
function attrEsc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ── Load subscriptions ───────────────────────────────────────────────────────
async function loadSubs() {
  try {
    const r = await fetch('/api/subscriptions').then(r => r.json());
    subs = r.subscriptions || [];
  } catch { subs = []; }
  renderSidebar();
}

// ── Render sidebar ───────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('sub-list');
  if (!subs.length) {
    list.innerHTML = '<div class="empty-state">No subscriptions yet</div>';
    return;
  }
  list.innerHTML = subs.map(s => {
    const count = (s.videos || []).length;
    const badge = count > 0 ? `<span style="margin-left:auto;font-size:.55rem;color:var(--text2);opacity:0.7">${count}</span>` : '';
    return `
    <div class="sub-item${activeSub && activeSub.id === s.id ? ' active' : ''}" data-id="${s.id}" style="display:flex;align-items:center;gap:4px">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(s.name || s.url)}</span>
      ${badge}
    </div>
  `}).join('');

  // Wire clicks
  list.querySelectorAll('.sub-item').forEach(item => {
    item.addEventListener('click', () => {
      activeSub = subs.find(s => s.id === item.dataset.id) || null;
      renderSidebar();
      renderDetail();
    });
  });

  // Render mini thumbnails for collapsed sidebar
  const miniList = document.getElementById('mini-list');
  if (miniList) {
    miniList.innerHTML = subs.map(s => {
      const isActive = activeSub && activeSub.id === s.id;
      const initial = (s.name || '?')[0].toUpperCase();
      return s.thumbnail_url
        ? `<div class="mini-thumb${isActive ? ' active' : ''}" data-id="${attrEsc(s.id)}" style="background-image:url('${esc(s.thumbnail_url)}')" title="${attrEsc(s.name || s.url)}"></div>`
        : `<div class="mini-thumb${isActive ? ' active' : ''}" data-id="${attrEsc(s.id)}" title="${attrEsc(s.name || s.url)}">${esc(initial)}</div>`;
    }).join('');
    miniList.querySelectorAll('.mini-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        activeSub = subs.find(s => s.id === thumb.dataset.id) || null;
        renderSidebar();
        renderDetail();
      });
    });
  }
}

// ── Global download state — persists across subscription switches ────────────
const allJobs = new Map(); // videoId → { jobId, status, data }
let pollTimer = null;
// Terminal backend states — everything else (queued/downloading/converting/
// or any future status) is treated as active so a job is never silently dropped.
const TERMINAL_STATES = ['done', 'error', 'cancelled'];

function updateVideoState(videoId, status, data) {
  const metaEl = document.getElementById('meta-' + videoId);
  if (!metaEl) return;
  const info = allJobs.get(videoId);
  const jobId = info ? info.jobId : '';

  if (status === 'queued') {
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status queued">Queued</span>
      <div style="flex:1"></div>
      <button class="video-action-btn" onclick="cancelJob('${attrEsc(jobId)}','${attrEsc(videoId)}')">Cancel</button>
    </div>`;
  } else if (status === 'downloading') {
    const pct = Math.round(data.progress || 0);
    const speed = data.speed || '';
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status downloading">${pct}%</span>
      <div class="video-progress-bar"><div class="video-progress-fill" style="width:${pct}%"></div></div>
      <span>${speed}</span>
      <button class="video-action-btn" onclick="cancelJob('${attrEsc(jobId)}','${attrEsc(videoId)}')">Cancel</button>
    </div>`;
  } else if (status === 'converting') {
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status downloading">Converting…</span>
      <div class="video-progress-bar"><div class="video-progress-fill" style="width:100%"></div></div>
      <div style="flex:1"></div>
      <button class="video-action-btn" onclick="cancelJob('${attrEsc(jobId)}','${attrEsc(videoId)}')">Cancel</button>
    </div>`;
  } else if (status === 'done') {
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status done">Downloaded</span>
      <div style="flex:1"></div>
      <button class="video-action-btn" onclick="clearVideoState('${attrEsc(videoId)}')">Clear</button>
    </div>`;
  } else if (status === 'error') {
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status error">${esc(data.error || 'Error')}</span>
      <div style="flex:1"></div>
      <button class="video-action-btn" onclick="clearVideoState('${attrEsc(videoId)}')">Clear</button>
    </div>`;
  } else if (status === 'cancelled') {
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status error">Cancelled</span>
      <div style="flex:1"></div>
      <button class="video-action-btn" onclick="clearVideoState('${attrEsc(videoId)}')">Clear</button>
    </div>`;
  } else {
    // Unknown, non-terminal status from the backend (forward-compat). Render a
    // generic active state with Cancel rather than no-op'ing (which would let a
    // re-render drop the card back to the bare date — the old 'converting' bug).
    metaEl.innerHTML = `<div class="video-progress">
      <span class="video-status downloading">Processing…</span>
      <div class="video-progress-bar"><div class="video-progress-fill" style="width:100%"></div></div>
      <div style="flex:1"></div>
      <button class="video-action-btn" onclick="cancelJob('${attrEsc(jobId)}','${attrEsc(videoId)}')">Cancel</button>
    </div>`;
  }
}

function restoreJobStates() {
  for (const [videoId, info] of allJobs) {
    updateVideoState(videoId, info.status, info.data || {});
    if (!TERMINAL_STATES.includes(info.status)) {
      const cb = document.querySelector(`.video-check[data-video-id="${CSS.escape(videoId)}"]`);
      if (cb) cb.disabled = true;
    }
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollJobs, 1500);
}

let _polling = false;
async function pollJobs() {
  if (_polling) return;
  _polling = true;
  try {
    for (const [videoId, info] of allJobs) {
      if (TERMINAL_STATES.includes(info.status)) continue;
      try {
        const resp = await fetch(`/api/status/${info.jobId}`);
        const data = await resp.json();
        if (data.error === 'Job not found') {
          allJobs.delete(videoId);
          continue;
        }
        info.status = data.status;
        info.data = data;
        updateVideoState(videoId, data.status, data);
        if (TERMINAL_STATES.includes(data.status)) {
          const cb = document.querySelector(`.video-check[data-video-id="${CSS.escape(videoId)}"]`);
          if (cb) cb.disabled = false;
          if (data.status === 'done' && info.subId) {
            fetch('/api/subscriptions/mark-downloaded', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sub_id: info.subId, video_id: videoId })
            }).catch(() => {});
          }
        }
      } catch {}
    }
  } finally {
    _polling = false;
  }
}

// ── Render detail ────────────────────────────────────────────────────────────
function renderDetail() {
  const detail = document.getElementById('detail');
  if (!activeSub) {
    detail.innerHTML = `<div class="detail-empty"><div>
      <div style="font-size:2rem;margin-bottom:8px">📡</div>
      <div>Select a subscription to view details</div>
    </div></div>`;
    return;
  }

  const videos = activeSub.videos || [];
  const sortedVideos = [...videos].sort((a, b) => {
    if (currentSort === 'oldest') return (a.upload_date || '').localeCompare(b.upload_date || '');
    return (b.upload_date || '').localeCompare(a.upload_date || '');
  });

  detail.innerHTML = `
    <div class="channel-header">
      <div class="channel-thumb" ${activeSub.thumbnail_url ? `style="background-image:url('${esc(activeSub.thumbnail_url)}');background-size:cover;background-position:center"` : ''}>
        ${!activeSub.thumbnail_url ? '📺' : ''}
      </div>
      <div class="channel-info">
        <h2>${esc(activeSub.name || 'Untitled')}</h2>
        <p>${esc(activeSub.url)}</p>
        <p style="font-size:.6rem;color:var(--text2);margin-top:2px">
          ${videos.length} videos${activeSub.last_fetched ? ' · Last fetched: ' + new Date(activeSub.last_fetched).toLocaleDateString() : ''}
        </p>
        <label style="display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--text2);margin-top:4px;cursor:pointer">
          <input type="checkbox" id="auto-fetch-toggle" ${activeSub.auto_fetch_on_open ? 'checked' : ''} style="accent-color:var(--acc);cursor:pointer">
          Auto-fetch on open
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--text2);margin-top:4px">
          Format:
          <select id="format-select" style="background:var(--surf2);border:1px solid var(--border);color:var(--text);font-size:.6rem;border-radius:3px;padding:1px 4px;cursor:pointer">
            <option value="video"${(activeSub.format || 'video') === 'video' ? ' selected' : ''}>Video</option>
            <option value="audio"${(activeSub.format || 'video') === 'audio' ? ' selected' : ''}>Audio</option>
          </select>
        </label>
        <div style="display:flex;align-items:center;gap:4px;font-size:.6rem;color:var(--text2);margin-top:4px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/></svg>
          <span id="dl-folder-label" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${attrEsc(activeSub.download_folder || 'Default (app setting)')}">${esc(activeSub.download_folder ? activeSub.download_folder.split(/[\\/]/).pop() : 'Default')}</span>
          <button id="dl-folder-browse" class="fetch-btn" style="font-size:.55rem;padding:1px 5px">Browse</button>
          ${activeSub.download_folder ? '<button id="dl-folder-reset" class="fetch-btn" style="font-size:.55rem;padding:1px 5px;color:var(--text2)">Reset</button>' : ''}
        </div>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <select id="sort-select" style="background:var(--surf2);border:1px solid var(--border);color:var(--text2);font-size:.65rem;border-radius:3px;padding:2px 4px;cursor:pointer">
          <option value="latest"${currentSort === 'latest' ? ' selected' : ''}>Latest</option>
          <option value="oldest"${currentSort === 'oldest' ? ' selected' : ''}>Oldest</option>
        </select>
        <button class="fetch-btn" onclick="fetchVideos('${attrEsc(activeSub.id)}', false)">Fetch</button>
        <button class="fetch-btn" onclick="fetchVideos('${attrEsc(activeSub.id)}', true)">Force</button>
        <button class="fetch-btn" style="color:var(--red);border-color:var(--red)" onclick="removeSub('${attrEsc(activeSub.id)}')">Delete</button>
      </div>
    </div>
    <div class="video-list" id="video-list">
      ${videos.length === 0 ? `
        <div class="empty-state">Click "Fetch" to load videos from this channel</div>
      ` : (() => {
        const visible = sortedVideos.slice(0, visibleCount);
        const hasMore = sortedVideos.length > visibleCount;
        const dlBar = `<div class="dl-bar">
          <label style="display:flex;align-items:center;gap:4px;font-size:.62rem;color:var(--text2);cursor:pointer">
            <input type="checkbox" id="select-all-check" style="accent-color:var(--acc);cursor:pointer"> Select all
          </label>
          <span id="dl-count" style="font-size:.6rem;color:var(--text2)"></span>
          <div style="flex:1"></div>
          <button class="dl-bar-btn" id="dl-selected-btn" disabled>Download selected</button>
        </div>`;
        return dlBar + visible.map(v => `
          <div class="video-card" data-video-id="${attrEsc(v.video_id || '')}">
            <input type="checkbox" class="video-check" data-video-id="${attrEsc(v.video_id || '')}" style="accent-color:var(--acc);cursor:pointer;width:16px;height:16px;flex-shrink:0">
            <div class="video-thumb" ${v.thumbnail_url ? `style="background-image:url('${esc(v.thumbnail_url)}')"` : ''}>
              ${!v.thumbnail_url ? '🎬' : ''}
              ${v.duration ? `<span class="video-duration">${formatDuration(v.duration)}</span>` : ''}
            </div>
            <div class="video-info" style="flex:1;min-width:0">
              <div class="video-title">${esc(v.title)}</div>
              <div class="video-meta" id="meta-${attrEsc(v.video_id || '')}">${esc(v.upload_date ? formatDate(v.upload_date) : '—')}${v.is_new ? ' <span style="font-size:.5rem;padding:1px 5px;border-radius:3px;background:rgba(45,212,191,.12);color:var(--acc);font-weight:500">New</span>' : ''}${v.downloaded ? ' <span class="video-status done">Downloaded</span>' : ''}${v.availability === 'subscriber_only' ? ' <span style="font-size:.5rem;padding:1px 5px;border-radius:3px;background:rgba(245,158,11,.12);color:var(--yellow);font-weight:500">Members</span>' : ''}</div>
            </div>
          </div>
        `).join('') + (hasMore ? `
          <button id="load-more-btn" style="width:100%;margin-top:10px;padding:10px;background:var(--surf2);border:1px solid var(--border);color:var(--text2);border-radius:6px;cursor:pointer;font-size:.7rem" onclick="visibleCount+=20;renderDetail()">Load more (${visible.length} of ${sortedVideos.length})</button>
        ` : `<div style="text-align:center;padding:10px;font-size:.6rem;color:var(--text2);opacity:0.5">${sortedVideos.length} videos total</div>`);
      })()}
    </div>
  `;

  const sortSelect = document.getElementById('sort-select');
  if (sortSelect) {
    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      renderDetail();
    });
  }

  const autoFetch = document.getElementById('auto-fetch-toggle');
  if (autoFetch) {
    autoFetch.addEventListener('change', async (e) => {
      await fetch('/api/subscriptions/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: activeSub.id, auto_fetch_on_open: e.target.checked })
      });
      activeSub.auto_fetch_on_open = e.target.checked;
    });
  }

  const formatSelect = document.getElementById('format-select');
  if (formatSelect) {
    formatSelect.addEventListener('change', async (e) => {
      await fetch('/api/subscriptions/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: activeSub.id, format: e.target.value })
      });
      activeSub.format = e.target.value;
    });
  }

  const dlFolderBrowse = document.getElementById('dl-folder-browse');
  if (dlFolderBrowse) {
    dlFolderBrowse.addEventListener('click', async () => {
      const picked = window.electronAPI?.pickFolder
        ? await window.electronAPI.pickFolder(activeSub.download_folder || '')
        : prompt('Enter download folder path:');
      if (!picked) return;
      const resp = await fetch('/api/subscriptions/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: activeSub.id, download_folder: picked })
      }).then(r => r.json());
      if (resp.ok) {
        activeSub.download_folder = picked;
        renderDetail();
      }
    });
  }

  const dlFolderReset = document.getElementById('dl-folder-reset');
  if (dlFolderReset) {
    dlFolderReset.addEventListener('click', async () => {
      await fetch('/api/subscriptions/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: activeSub.id, download_folder: null })
      });
      activeSub.download_folder = null;
      renderDetail();
    });
  }

  // ── Checkbox selection ────────────────────────────────────────────────────
  function updateSelectionCount() {
    const checks = document.querySelectorAll('.video-check:checked');
    const countEl = document.getElementById('dl-count');
    const dlBtn = document.getElementById('dl-selected-btn');
    const selectAll = document.getElementById('select-all-check');
    const allChecks = document.querySelectorAll('.video-check');
    if (countEl) countEl.textContent = checks.length > 0 ? `${checks.length} selected` : '';
    if (dlBtn) dlBtn.disabled = checks.length === 0;
    if (selectAll && allChecks.length > 0) selectAll.checked = checks.length === allChecks.length;
  }

  const selectAll = document.getElementById('select-all-check');
  if (selectAll) {
    selectAll.addEventListener('change', (e) => {
      document.querySelectorAll('.video-check').forEach(cb => {
        cb.checked = e.target.checked;
        cb.closest('.video-card')?.classList.toggle('checked', e.target.checked);
      });
      updateSelectionCount();
    });
  }

  document.getElementById('video-list')?.addEventListener('change', (e) => {
    if (e.target.classList.contains('video-check')) {
      e.target.closest('.video-card')?.classList.toggle('checked', e.target.checked);
      updateSelectionCount();
    }
  });

  // ── Download orchestration (global state — persists across subscription switches) ──
  const dlBtn = document.getElementById('dl-selected-btn');
  if (dlBtn) {
    dlBtn.addEventListener('click', async () => {
      const checked = document.querySelectorAll('.video-check:checked');
      if (!checked.length) return;

      // Get subscription settings
      const subFormat = activeSub.format || 'video';
      const subFolder = activeSub.download_folder || null;

      // Get main app settings as fallback
      let appSettings = {};
      try { appSettings = await fetch('/api/settings').then(r => r.json()); } catch {}
      const dlDir = subFolder || appSettings.last_folder || '';

      dlBtn.disabled = true;
      dlBtn.textContent = 'Starting...';

      for (const cb of checked) {
        const videoId = cb.dataset.videoId;
        if (allJobs.has(videoId) && !TERMINAL_STATES.includes(allJobs.get(videoId).status)) continue;

        // Find video data from cache
        const video = (activeSub.videos || []).find(v => (v.video_id || '') === videoId);
        const videoUrl = video ? `https://www.youtube.com/watch?v=${video.video_id}` : videoId;

        try {
          const resp = await fetch('/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: videoUrl,
              format: subFormat,
              download_dir: dlDir,
              title: video?.title || '',
              thumbnail: video?.thumbnail_url || '',
              embed_metadata: true,
              subtitles: false
            })
          });
          const result = await resp.json();
          if (result.job_id) {
            allJobs.set(videoId, { jobId: result.job_id, status: 'queued', data: {}, subId: activeSub.id });
            updateVideoState(videoId, 'queued', {});
            cb.checked = false;
            cb.disabled = true;
          }
        } catch (e) {
          console.error('Download start failed:', videoId, e);
        }
      }

      updateSelectionCount();
      dlBtn.textContent = 'Download selected';

      // Start polling and run an immediate check
      startPolling();
      pollJobs();
    });
  }

  // Restore states for any tracked jobs visible in the current view
  restoreJobStates();
}

async function cancelJob(jobId, videoId) {
  try {
    await fetch(`/api/cancel/${jobId}`, { method: 'POST' });
  } catch {}
}

function clearVideoState(videoId) {
  allJobs.delete(videoId);
  const metaEl = document.getElementById('meta-' + videoId);
  if (!metaEl) return;
  const video = (activeSub?.videos || []).find(v => (v.video_id || '') === videoId);
  metaEl.textContent = video?.upload_date ? formatDate(video.upload_date) : '—';
}

let currentSort = 'latest';

function formatDuration(sec) {
  if (!sec) return '';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function formatDate(d) {
  if (!d || typeof d !== 'string' || d.length !== 8 || !/^\d{8}$/.test(d)) return '';
  return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
}

// ── Fetch videos ─────────────────────────────────────────────────────────────
let visibleCount = 20;

async function fetchVideos(id, force) {
  visibleCount = 20; // reset on new fetch
  const list = document.getElementById('video-list');
  if (list) list.innerHTML = '<div class="empty-state"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;animation:spin 1.5s linear infinite" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg> Fetching videos...</div>';

  try {
    const r = await fetch('/api/subscriptions/fetch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, force })
    }).then(r => r.json());

    if (r.subscription) {
      const idx = subs.findIndex(s => s.id === id);
      if (idx >= 0) subs[idx] = r.subscription;
      if (activeSub && activeSub.id === id) activeSub = r.subscription;
      renderSidebar();
      renderDetail();
    } else {
      if (list) list.innerHTML = `<div class="empty-state" style="color:var(--red,#e04040)">Error: ${esc(r.error || 'Unknown')}</div>`;
    }
  } catch {
    if (list) list.innerHTML = '<div class="empty-state" style="color:var(--red,#e04040)">Fetch failed</div>';
  }
}

// ── Add subscription ─────────────────────────────────────────────────────────
async function addSub() {
  const input = document.getElementById('add-url');
  const url = input.value.trim();
  if (!url) return;

  input.disabled = true;
  try {
    const r = await fetch('/api/subscriptions/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    }).then(r => r.json());

    if (r.subscription) {
      input.value = '';
      await loadSubs();
      activeSub = r.subscription;
      renderSidebar();
      renderDetail();
      fetchVideos(r.subscription.id, false);
    } else {
      input.style.borderColor = 'var(--red, #e04040)';
      setTimeout(() => input.style.borderColor = '', 1500);
    }
  } catch {}
  input.disabled = false;
}

document.getElementById('add-url').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addSub();
});

document.getElementById('add-btn').addEventListener('click', addSub);

document.getElementById('paste-btn').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('add-url').value = text;
  } catch {}
});

// ── Remove subscription ──────────────────────────────────────────────────────
async function removeSub(id) {
  const sub = subs.find(s => s.id === id);
  const name = sub ? (sub.name || sub.url) : 'this subscription';
  if (!confirm(`Remove "${name}"? This cannot be undone.`)) return;

  // Optimistic UI: remove locally first, then sync with server
  subs = subs.filter(s => s.id !== id);
  if (activeSub && activeSub.id === id) activeSub = null;
  renderSidebar();
  renderDetail();

  // Re-enable input in case it was stuck
  const input = document.getElementById('add-url');
  if (input) input.disabled = false;

  // Background sync
  try {
    await fetch('/api/subscriptions/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
  } catch {}
}

// ── Sidebar collapse ─────────────────────────────────────────────────────────
document.getElementById('collapse-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

// ── Back to app ──────────────────────────────────────────────────────────────
document.getElementById('history-btn').addEventListener('click', () => {
  if (window.electronAPI && window.electronAPI.openHistoryWindow) {
    window.electronAPI.openHistoryWindow();
  } else {
    window.open('/history-page', '_blank');
  }
});

document.getElementById('back-btn').addEventListener('click', () => {
  if (window.electronAPI && window.electronAPI.closeSubscriptions) {
    window.electronAPI.closeSubscriptions();
  } else {
    window.close();
  }
});

// ── Init ─────────────────────────────────────────────────────────────────────
loadSubs().then(() => {
  const autoFetchSubs = subs.filter(s => s.auto_fetch_on_open);
  if (autoFetchSubs.length > 0) {
    // Select first auto-fetch channel so user sees it loading
    activeSub = autoFetchSubs[0];
    renderSidebar();
    renderDetail();
    autoFetchSubs.forEach(s => fetchVideos(s.id, false));
  }
});
