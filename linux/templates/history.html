<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Download History — EGM Downloader</title>
<style>
    body.from-subs .rb[title="Re-add"] { display: none; }
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b1120;--surf:#111c2e;--surf2:#162338;--surf3:#1c2d47;
    --border:#1e3a5f;--border2:#274d7a;--acc:#3b82f6;--acc-h:#60a5fa;
    --text:#e2e8f0;--text2:#8b949e;--muted:#4a5568;
    --green:#4ade80;--red:#f87171;--yellow:#fbbf24;
    --shadow:0 4px 32px rgba(0,0,0,.6);
  }
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  {% include 'theme_styles.html' %}

  /* titlebar */
  .titlebar{background:var(--surf2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
  .titlebar h1{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
  .total-badge{font-size:10px;background:rgba(59,130,246,.15);color:var(--acc);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:1px 8px}
  .tb-actions{display:flex;gap:8px}
  .tb-btn{font-size:11px;padding:3px 12px;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2)}
  .tb-btn:hover{color:var(--text);border-color:var(--acc)}
  .tb-btn.danger{color:var(--red);border-color:rgba(239,68,68,.4)}
  .tb-btn.danger:hover{background:rgba(239,68,68,.08)}

  /* toolbar */
  .toolbar{background:var(--surf);padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
  .search{flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:6px;height:28px;padding:0 10px;font-size:11px;color:var(--text);outline:none}
  .search::placeholder{color:var(--text2);opacity:0.55}
  .search:focus{border-color:var(--acc)}
  .filter-btn{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap}
  .filter-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(59,130,246,.1)}
  .filter-btn:hover:not(.active){color:var(--text)}
  .sort-btn{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text2);cursor:pointer}
  .sort-btn:hover{color:var(--text)}

  /* table */
  .table-wrap{flex:1;overflow-y:auto;overflow-x:hidden}
  .table-header{display:grid;grid-template-columns:100px 1fr 80px 70px 70px 90px;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--surf);position:sticky;top:0;z-index:1}
  .th{font-size:9px;font-weight:500;color:var(--text2);opacity:0.65;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;transition:opacity .1s}
  .th:hover{color:var(--text2);opacity:1}
  .row{display:grid;grid-template-columns:100px 1fr 80px 70px 70px 90px;padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.04);align-items:center}
  .row:hover{background:var(--surf2)}
  .rthumb-wrap{position:relative;width:96px;height:54px;border-radius:4px;overflow:hidden;background:var(--surf2);flex-shrink:0;border:0.5px solid var(--border)}
  .rthumb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(0.4);transform:scale(1.2)}
  .rthumb-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* lint-allow-muted: decorative-icon */
  .rthumb-icon{width:96px;height:54px;border-radius:4px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);border:0.5px solid var(--border)}
  .rt{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
  .rm{font-size:9px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;margin-top:1px}
  .col{font-size:10px;color:var(--text2)}
  .col.hi{color:var(--text)}
  .fmt{font-size:9px;padding:1px 6px;border-radius:3px;border:1px solid;display:inline-block}
  .fmt-mp3,.fmt-aac,.fmt-m4a{background:rgba(22,163,74,.1);color:#4ade80;border-color:rgba(22,163,74,.3)}
  .fmt-mp4,.fmt-webm{background:rgba(59,130,246,.1);color:#60a5fa;border-color:rgba(59,130,246,.3)}
  .fmt-flac,.fmt-wav{background:rgba(168,85,247,.1);color:#c084fc;border-color:rgba(168,85,247,.3)}
  .fmt-other{background:rgba(255,255,255,.06);color:var(--text2);border-color:var(--border)}
  .row-btns{display:flex;gap:3px;justify-content:flex-end;margin-left:auto;opacity:0;transition:opacity .1s}
  .row:hover .row-btns{opacity:1}
  .rb{width:24px;height:24px;padding:0;border-radius:5px;cursor:pointer;border:0.5px solid var(--border2);background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rb:hover{color:var(--acc);border-color:var(--acc)}
  .rb.red:hover{color:var(--red);border-color:var(--red)}
  .rb.pin-rb{color:var(--border2)}
  .rb.pin-rb.pinned{color:var(--acc);border-color:var(--acc)}
  .row.row-pinned{background:rgba(45,212,191,.05);border-left:2px solid rgba(45,212,191,.3)}
  /* lint-allow-muted: empty-state */
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}

  /* pagination */
  .pagination{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border);background:var(--surf);flex-shrink:0}
  .pg-info{font-size:10px;color:var(--text2)}
  .pg-btns{display:flex;gap:4px}
  .pg-btn{font-size:10px;padding:3px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer}
  .pg-btn.active{border-color:var(--acc);color:var(--acc);background:rgba(59,130,246,.1)}
  .pg-btn:hover:not(.active):not(:disabled){color:var(--text)}
  .pg-btn:disabled{opacity:.3;cursor:default}

  /* statusbar */
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;background:var(--surf2);border-top:1px solid var(--border);flex-shrink:0}
  /* lint-allow-muted: supplementary-metadata */
  .sb-text{font-size:9px;color:var(--muted)}

    /* ── Scrollbar theming ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>

<div class="titlebar">
  <h1>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
    Download History
    <span class="total-badge" id="total-badge">0</span>
  </h1>
  <div class="tb-actions">
    <button class="tb-btn danger" id="clear-all-btn" data-i18n="history.btn.clear_all">Clear All</button>
  </div>
</div>

<div class="toolbar">
  <input class="search" id="search-input" placeholder="Search title, URL, format…">
  <button class="filter-btn active" data-filter="all" data-i18n="history.filter.all">All</button>
  <button class="filter-btn" data-filter="video" data-i18n="history.filter.video">Video</button>
  <button class="filter-btn" data-filter="audio" data-i18n="history.filter.audio">Audio</button>
  <button class="filter-btn" data-filter="flac" data-i18n="history.filter.flac">FLAC</button>
  <button class="sort-btn" id="sort-btn" data-i18n="history.sort.newest">↓ Newest</button>
</div>

<div class="table-header">
  <div class="th"></div>
  <div class="th">Title</div>
  <div class="th">Format</div>
  <div class="th">Size</div>
  <div class="th">Date</div>
  <div class="th" style="text-align:right">Actions</div>
</div>

<div class="table-wrap" id="table-wrap">
  <div class="empty-state" id="empty-state" style="display:none" data-i18n="history.empty">No downloads yet</div>
</div>

<div class="pagination" id="pagination">
  <span class="pg-info" id="pg-info">Showing 0–0 of 0</span>
  <div class="pg-btns" id="pg-btns"></div>
</div>

<div class="statusbar">
  <span class="sb-text" id="status-bar">0 downloads</span>
</div>

<script>
{% include 'i18n.html' %}
// ── API token interceptor ────────────────────────────────────────────────────
(function() {
  const _t = '{{ egm_token }}';
  if (!_t) return;
  const _f = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === 'string' && url.startsWith('/api/')) {
      opts = opts || {};
      opts.headers = opts.headers || {};
      opts.headers['X-EGM-Token'] = _t;
    }
    return _f.call(this, url, opts);
  };
})();
(function() {
  // Apply saved theme and listen for changes.
  // Track the single currently-applied theme class instead of maintaining a
  // hardcoded list of every theme name — the old list drifted behind the 450-
  // theme catalog (so switching away from a newer theme left a stale body
  // class) and contained a Cyrillic-homoglyph key that never matched. Removing
  // exactly what we last added needs no catalog knowledge and cannot drift.
  let _histThemeClass = '';
  function applyHistTheme(name) {
    if (_histThemeClass) { document.body.classList.remove(_histThemeClass); _histThemeClass = ''; }
    if (name && name !== 'void') { document.body.classList.add(name); _histThemeClass = name; }
  }
  const theme = localStorage.getItem('egm-theme') || 'void';
  applyHistTheme(theme);
  if (window.electronAPI && window.electronAPI.onThemeChanged) {
    window.electronAPI.onThemeChanged(t => applyHistTheme(t));
  }
  // When History is opened from the Subscriptions window, the "Re-add to main"
  // action is out of context — hide it (driven by the ?from=subs URL param).
  try {
    if (new URLSearchParams(location.search).get('from') === 'subs') {
      document.body.classList.add('from-subs');
    }
  } catch {}

  const AUDIO_FMTS = ['mp3','aac','flac','wav','ogg','m4a','opus'];
  const PER_PAGE = 10;

  let allItems = [];
  let filtered = [];
  let currentPage = 1;
  let currentFilter = 'all';
  let searchQuery = '';
  let sortAsc = false; // false = newest first

  function fmtSize(b) {
    if (!b) return '—';
    if (b > 1073741824) return (b/1073741824).toFixed(1) + ' GB';
    if (b > 1048576)    return (b/1048576).toFixed(1) + ' MB';
    if (b > 1024)       return (b/1024).toFixed(0) + ' KB';
    return b + ' B';
  }
  function fmtDate(iso) {
    try {
      const d = new Date(iso), now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 86400) return i18nGet('history.date.today') || 'Today';
      if (diff < 172800) return i18nGet('history.date.yesterday') || 'Yesterday';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
    } catch { return ''; }
  }
  function fmtClass(f) {
    if (!f) return 'fmt-other';
    const fm = f.toLowerCase();
    if (['mp3','aac','m4a'].includes(fm)) return 'fmt-mp3';
    if (['mp4','webm'].includes(fm))      return 'fmt-mp4';
    if (['flac','wav'].includes(fm))      return 'fmt-flac';
    return 'fmt-other';
  }
  // Escape title/filename/url before innerHTML — these come from the source site
  // (download title) or an imported history JSON, so they must render as text.
  function escH(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function totalSize(items) {
    const t = items.reduce((s,i) => s + (i.size_bytes||0), 0);
    return t ? fmtSize(t) : '';
  }

  async function loadAll() {
    // Load all history pages (for client-side filtering/search)
    let items = [], page = 1;
    while (true) {
      const d = await fetch(`/api/history?page=${page}&per_page=50`).then(r=>r.json());
      items = items.concat(d.items || []);
      if (page >= d.pages) break;
      page++;
    }
    allItems = items;
    applyFilters();
  }

  function applyFilters() {
    let items = [...allItems];
    // Search
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      items = items.filter(i =>
        (i.title||'').toLowerCase().includes(q) ||
        (i.url||'').toLowerCase().includes(q) ||
        (i.format||'').toLowerCase().includes(q) ||
        (i.filename||'').toLowerCase().includes(q)
      );
    }
    // Format filter
    if (currentFilter === 'video') items = items.filter(i => !AUDIO_FMTS.includes((i.format||'').toLowerCase()));
    if (currentFilter === 'audio') items = items.filter(i => AUDIO_FMTS.includes((i.format||'').toLowerCase()) && i.format !== 'flac');
    if (currentFilter === 'flac')  items = items.filter(i => (i.format||'').toLowerCase() === 'flac');
    // Sort
    if (sortAsc) items = [...items].reverse();
    const pinned = items.filter(i => pinnedIds.has(String(i.id)));
    const unpinned = items.filter(i => !pinnedIds.has(String(i.id)));
    filtered = [...pinned, ...unpinned];
    currentPage = 1;
    render();
  }

  let pinnedIds = new Set();
  try { pinnedIds = new Set((JSON.parse(localStorage.getItem('egm-history-pins') || '[]') || []).map(String)); } catch {}

  function render() {
    const wrap = document.getElementById('table-wrap');
    const empty = document.getElementById('empty-state');
    wrap.querySelectorAll('.row').forEach(el => el.remove());

    document.getElementById('total-badge').textContent = allItems.length;
    const ts = totalSize(allItems);
    document.getElementById('status-bar').textContent = ts
      ? (i18nFmt('history.summary', allItems.length, ts) || `${allItems.length} downloads · ${ts} total`)
      : (i18nFmt('status.bar.count', allItems.length) || `${allItems.length} downloads`);

    if (filtered.length === 0) { empty.style.display = ''; updatePagination(0, 0, 0); return; }
    empty.style.display = 'none';

    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    currentPage = Math.min(currentPage, pages);
    const start = (currentPage - 1) * PER_PAGE;
    const pageItems = filtered.slice(start, start + PER_PAGE);

    pageItems.forEach(item => {
      const row = document.createElement('div');
      row.className = 'row';
      const isAudio = AUDIO_FMTS.includes((item.format||'').toLowerCase());
      const thumbHtml = item.thumbnail
        ? `<div class="rthumb-wrap"><img class="rthumb-bg" src="/api/thumbnail/${item.thumbnail}" alt=""><img class="rthumb-fg" src="/api/thumbnail/${item.thumbnail}" alt=""></div>`
        : `<div class="rthumb-icon">${isAudio ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>'}</div>`;
      row.innerHTML = `
        ${thumbHtml}
        <div style="min-width:0;overflow:hidden">
          <div class="rt">${escH(item.title || item.filename || '—')}</div>
          <div class="rm">${escH(item.url || '')}</div>
        </div>
        <div class="col"><span class="fmt ${fmtClass(item.format)}">${(item.format||'?').toUpperCase()}</span></div>
        <div class="col hi">${fmtSize(item.size_bytes)}</div>
        <div class="col">${fmtDate(item.completed_at)}</div>
        <div class="row-btns">
          <button class="rb pin-rb" title="Pin to top"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
          <button class="rb" title="Re-add"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg></button>
          <button class="rb" title="${i18nAttr('tooltip.card.open_folder', 'Open folder')}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/></svg></button>
          <button class="rb red" title="${i18nAttr('tooltip.card.remove', 'Remove')}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg></button>
        </div>`;
      const [btnPin, btnReadd, btnOpen, btnDel] = row.querySelectorAll('.rb');
      if (pinnedIds.has(String(item.id))) {
        row.classList.add('row-pinned');
        btnPin.querySelector('svg')?.setAttribute('fill', 'currentColor');
        btnPin.classList.add('pinned');
        btnPin.title = 'Unpin';
      }
      btnPin.addEventListener('click', () => {
        const id = String(item.id);
        if (pinnedIds.has(id)) { pinnedIds.delete(id); }
        else { pinnedIds.add(id); }
        try { localStorage.setItem('egm-history-pins', JSON.stringify([...pinnedIds])); } catch {}
        applyFilters();
      });
      btnReadd.addEventListener('click', () => {
        // Helper to apply append-with-dedup logic to a target window's textarea
        const applyToTextarea = (targetWindow) => {
          try {
            const urlsEl = targetWindow.document.getElementById('urls');
            if (!urlsEl) return false;
            const existing = urlsEl.value.trim();
            const lines = existing ? existing.split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [];
            if (!lines.includes(item.url)) {
              urlsEl.value = lines.length ? `${lines.join('\n')}\n${item.url}` : item.url;
              urlsEl.dispatchEvent(new Event('input', { bubbles: true }));
            }
            try { targetWindow.focus(); } catch {}
            return true;
          } catch { return false; }
        };

        let added = false;
        // Path 1: Electron IPC — bulletproof for cross-window in Electron
        // Main process forwards the URL to mainWindow.webContents which appends it
        if (window.electronAPI && typeof window.electronAPI.sendUrlToMain === 'function') {
          try { window.electronAPI.sendUrlToMain(item.url); added = true; } catch {}
        }
        // Path 2: Direct window.opener access (works when opened via window.open in browser)
        if (!added && window.opener && !window.opener.closed) {
          added = applyToTextarea(window.opener);
        }
        // Path 3: BroadcastChannel fallback (same-origin, browser fallback)
        if (!added) {
          try {
            const ch = new BroadcastChannel('egm-readd');
            ch.postMessage({ url: item.url });
            ch.close();
            added = true;
          } catch (e) {
            alert('Could not send URL to main window.');
            return;
          }
        }
        // Visual feedback in history window — flash the row briefly
        row.style.transition = 'background .2s';
        row.style.background = 'rgba(74,222,128,.15)';
        setTimeout(() => { row.style.background = ''; }, 600);
      });
      btnOpen.addEventListener('click',  () => { window.electronAPI?.openFolder(item.download_dir); });
      btnDel.addEventListener('click',   async () => {
        await fetch(`/api/history/${item.id}`, { method: 'DELETE' });
        allItems = allItems.filter(i => i.id !== item.id);
        applyFilters();
      });
      wrap.appendChild(row);
    });

    updatePagination(start + 1, start + pageItems.length, total);
  }

  function updatePagination(from, to, total) {
    document.getElementById('pg-info').textContent = total > 0 ? (i18nFmt('history.showing', from, to, total) || `Showing ${from}–${to} of ${total}`) : 'No results';
    const pages = Math.max(1, Math.ceil(total / PER_PAGE));
    const btns = document.getElementById('pg-btns');
    btns.innerHTML = '';
    const prev = document.createElement('button');
    prev.className = 'pg-btn'; prev.textContent = i18nGet('history.btn.newer') || '← Newer';
    if (currentPage <= 1) prev.disabled = true;
    prev.addEventListener('click', () => { currentPage--; render(); });
    btns.appendChild(prev);
    const pageNums = [];
    for (let i = Math.max(1, currentPage - 1); i <= Math.min(pages, currentPage + 1); i++) pageNums.push(i);
    pageNums.forEach(p => {
      const b = document.createElement('button');
      b.className = 'pg-btn' + (p === currentPage ? ' active' : '');
      b.textContent = p;
      b.addEventListener('click', () => { currentPage = p; render(); });
      btns.appendChild(b);
    });
    const next = document.createElement('button');
    next.className = 'pg-btn'; next.textContent = i18nGet('history.btn.older') || 'Older →';
    if (currentPage >= pages) next.disabled = true;
    next.addEventListener('click', () => { currentPage++; render(); });
    btns.appendChild(next);
  }

  // Event wiring
  document.getElementById('search-input').addEventListener('input', e => { searchQuery = e.target.value.trim(); applyFilters(); });
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });
  document.getElementById('sort-btn').addEventListener('click', () => {
    sortAsc = !sortAsc;
    document.getElementById('sort-btn').textContent = sortAsc ? (i18nGet('history.sort.oldest') || '↑ Oldest') : (i18nGet('history.sort.newest') || '↓ Newest');
    applyFilters();
  });
  document.getElementById('clear-all-btn').addEventListener('click', async () => {
    if (!confirm(i18nGet('history.confirm.clear') || 'Clear all download history? This cannot be undone.')) return;
    await fetch('/api/history/clear', { method: 'POST' });
    allItems = []; applyFilters();
  });

  loadAll();
})();
</script>
</body>
</html>
