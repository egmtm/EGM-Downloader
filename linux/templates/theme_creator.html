<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Theme Creator — EGM Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Creator chrome uses a fixed neutral palette so the controls stay readable
       no matter what colors the user is previewing. The preview vars are scoped
       to #cv-preview only (set via JS), never to the page root. */
    :root {
      --c-bg:#0e1117; --c-surf:#171c24; --c-surf2:#1e2530; --c-border:#2a3340;
      --c-text:#e6ebf2; --c-text2:#93a1b3; --c-acc:#3b82f6; --c-acc-text:#ffffff;
      --c-danger:#ef4444; --r:9px;
    }
    body {
      font-family:'Segoe UI',system-ui,sans-serif;
      background:var(--c-bg); color:var(--c-text);
      height:100vh; display:flex; overflow:hidden; font-size:13px;
    }

    /* ── Right: controls ────────────────────────────────────────────────────── */
    #cv-controls { flex:1 1 auto; display:flex; flex-direction:column; background:var(--c-bg); }
    .cv-head { display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid var(--c-border); }
    .cv-head h1 { font-size:14px; font-weight:700; flex:1; }
    #cv-close { width:28px; height:28px; border:none; background:transparent; color:var(--c-text2); font-size:20px; line-height:1; border-radius:6px; cursor:pointer; }
    #cv-close:hover { background:var(--c-surf2); color:var(--c-text); }
    .cv-body { flex:1 1 auto; overflow:auto; padding:14px; }
    .cv-field { margin-bottom:14px; }
    .cv-field label { display:block; font-size:11px; color:var(--c-text2); margin-bottom:5px; }
    #cv-name { width:100%; padding:8px 10px; background:var(--c-surf2); border:1px solid var(--c-border); border-radius:7px; color:var(--c-text); font-size:13px; }
    #cv-name:focus { outline:none; border-color:var(--c-acc); }
    .cv-pick-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--c-border); }
    .cv-pick-row .nm { flex:1; }
    .cv-pick-row .nm b { display:block; font-size:12px; color:var(--c-text); }
    .cv-pick-row .nm span { font-size:10px; color:var(--c-text2); }
    input.cv-pick { width:42px; height:30px; padding:0; border:1px solid var(--c-border); border-radius:6px; background:var(--c-surf2); cursor:pointer; }
    input.cv-pick::-webkit-color-swatch-wrapper { padding:2px; }
    input.cv-pick::-webkit-color-swatch { border:none; border-radius:4px; }
    .cv-foot { flex:0 0 auto; display:flex; gap:7px; padding:12px 14px; border-top:1px solid var(--c-border); background:var(--c-surf); }
    .cv-btn { flex:1; padding:8px 0; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--c-border); background:var(--c-surf2); color:var(--c-text); }
    .cv-btn:hover { border-color:var(--c-acc); }
    .cv-btn-primary { background:var(--c-acc); border-color:var(--c-acc); color:var(--c-acc-text); }
    .cv-btn-danger { background:transparent; border-color:var(--c-danger); color:var(--c-danger); }

    /* ── Modals + toast ─────────────────────────────────────────────────────── */
    .cv-modal-back { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; }
    .cv-modal { width:300px; max-width:90vw; background:var(--c-surf); border:1px solid var(--c-border); border-radius:12px; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.8); }
    .cv-modal h3 { font-size:14px; margin-bottom:8px; }
    .cv-modal p { font-size:12px; color:var(--c-text2); margin-bottom:16px; line-height:1.5; }
    .cv-modal-actions { display:flex; gap:8px; }
    #cv-toast {
      position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--c-surf2); border:1px solid var(--c-border); color:var(--c-text);
      padding:9px 16px; border-radius:8px; font-size:12px; opacity:0; pointer-events:none;
      transition:opacity .2s, transform .2s; z-index:60;
    }
    #cv-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #cv-toast.ok  { border-color:#2e7d52; }
    #cv-toast.err { border-color:var(--c-danger); }
  </style>
</head>
<body id="creator-root">

  <!-- ── Controls (full width — main window is the live preview) ── -->
  <div id="cv-controls">
    <div class="cv-head">
      <h1>Theme Creator</h1>
      <button id="cv-close" title="Close" aria-label="Close">&times;</button>
    </div>
    <div class="cv-body">
      <div class="cv-field">
        <label for="cv-name">Theme name</label>
        <input id="cv-name" type="text" maxlength="60" autocomplete="off" spellcheck="false"/>
      </div>
      <div class="cv-picks">
        <div class="cv-pick-row"><div class="nm"><b>App background</b><span>The canvas</span></div><input class="cv-pick" type="color" data-var="--bg" aria-label="App background"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Surface</b><span>Cards, panels</span></div><input class="cv-pick" type="color" data-var="--surf" aria-label="Surface"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Surface 2</b><span>Slightly lighter surfaces</span></div><input class="cv-pick" type="color" data-var="--surf2" aria-label="Surface 2"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Accent</b><span>Buttons, highlights</span></div><input class="cv-pick" type="color" data-var="--acc" aria-label="Accent"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Text</b><span>Primary text</span></div><input class="cv-pick" type="color" data-var="--text" aria-label="Text"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Muted text</b><span>Secondary text</span></div><input class="cv-pick" type="color" data-var="--text2" aria-label="Muted text"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Border</b><span>Visible everywhere</span></div><input class="cv-pick" type="color" data-var="--border" aria-label="Border"/></div>
        <div class="cv-pick-row"><div class="nm"><b>Danger</b><span>Cancel / delete actions</span></div><input class="cv-pick" type="color" data-var="--red" aria-label="Danger"/></div>
      </div>
    </div>
    <div class="cv-foot">
      <button class="cv-btn" id="cv-reset">Reset</button>
      <button class="cv-btn" id="cv-random">Random</button>
      <button class="cv-btn" id="cv-export">Export</button>
      <button class="cv-btn cv-btn-primary" id="cv-save">Save to app</button>
    </div>
  </div>

  <script>
  {% raw %}
  // ── API token interceptor — same as the other windows ──────────────────────
  (function() {
    const _t = '{% endraw %}{{ egm_token }}{% raw %}';
    const _f = window.fetch;
    window.fetch = function(url, opts) {
      if (typeof url === 'string' && url.startsWith('/api/') && _t) {
        opts = opts || {};
        opts.headers = Object.assign({}, opts.headers || {}, { 'X-EGM-Token': _t });
      }
      return _f.call(this, url, opts);
    };
  })();
  {% endraw %}{% include 'theme_validator.html' %}
{% include 'theme_data.html' %}
{% include 'js/_creator.html' %}
  </script>
</body>
</html>
