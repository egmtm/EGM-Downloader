<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostics — EGM Downloader</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0b1120;--surf:#111c2e;--surf2:#162338;--surf3:#1c2d47;
    --border:#1e3a5f;--border2:#274d7a;--acc:#3b82f6;--acc-h:#60a5fa;
    --text:#e2e8f0;--text2:#8b949e;--muted:#4a5568;
    --green:#4ade80;--red:#f87171;--yellow:#fbbf24;
    --shadow:0 4px 32px rgba(0,0,0,.6);
  }
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  {% include 'theme_styles.html' %}

  .titlebar{background:var(--surf2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
  .titlebar h1{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
  .live-dot.paused{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
  .tb-note{font-size:10px;color:var(--text2);opacity:.7}

  .log-wrap{flex:1;overflow-y:auto;padding:10px 14px;font-family:Consolas,Menlo,'SF Mono',monospace;font-size:11.5px;line-height:1.55;user-select:text}
  /* Body text uses --text (the one var every theme guarantees readable on its
     bg) with slight opacity; --text2/--muted go too dim on several themes. */
  .log-line{white-space:pre-wrap;word-break:break-word;color:var(--text);opacity:.85}
  .log-line .lt{color:var(--text2);margin-right:8px}
  .log-line.err{color:var(--red);opacity:1}
  .log-line.okc{color:var(--green);opacity:1}
  .log-line.yt{opacity:.6;font-size:11px}
  .log-line.yt .lt{opacity:.8}
  .log-line.flask{opacity:.6;font-size:11px}
  .log-line.flask .lt{opacity:.8}
  /* lint-allow-muted: empty-state */
  .log-empty{color:var(--muted);padding:20px 6px;font-style:italic}

  .log-wrap::-webkit-scrollbar{width:8px}
  .log-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
</style>
</head>
<body>
  <div class="titlebar">
    <h1><span class="live-dot" id="live-dot"></span><span data-i18n="console.title">Diagnostics</span></h1>
    <div style="display:flex;align-items:center;gap:12px">
      <label style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2);cursor:pointer;user-select:none">
        <input type="checkbox" id="yt-toggle" style="accent-color:var(--acc)">
        <span data-i18n="console.toggle.ytdlp">Show yt-dlp output</span>
      </label>
      <label style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2);cursor:pointer;user-select:none">
        <input type="checkbox" id="flask-toggle" style="accent-color:var(--acc)">
        <span data-i18n="console.toggle.flask">Show Flask output</span>
      </label>
      <button id="export-btn" style="font-size:10.5px;padding:3px 12px;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2)" data-i18n="console.btn.export">Export</button>
      <span class="tb-note" data-i18n="console.readonly_note">Read-only — live application log</span>
    </div>
  </div>
  <div class="log-wrap" id="log-wrap">
    <div class="log-empty" id="log-empty" data-i18n="console.empty">No log entries yet.</div>
  </div>

<script>
{% include 'i18n.html' %}
// ── API token interceptor (same pattern as the other windows) ────────────────
(function() {
  const _t = '{{ egm_token }}';
  if (!_t) return;
  const _f = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === 'string' && url.startsWith('/api/')) {
      opts = opts || {};
      opts.headers = opts.headers || {};
      opts.headers['X-EGM-Token'] = _t;
    }
    return _f.call(this, url, opts);
  };
})();

// ── Theme + window title (same pattern as the other child windows) ───────────
let _themeClass = '';
function applyConsoleTheme(name) {
  if (_themeClass) { document.body.classList.remove(_themeClass); _themeClass = ''; }
  if (name && name !== 'void') { document.body.classList.add(name); _themeClass = name; }
}
applyConsoleTheme(localStorage.getItem('egm-theme') || 'void');
if (window.electronAPI && window.electronAPI.onThemeChanged) {
  window.electronAPI.onThemeChanged(t => applyConsoleTheme(t));
}
document.addEventListener('i18n:ready', () => {
  document.title = (i18nGet('console.title') || 'Diagnostics') + ' — EGM Downloader';
});

// ── Live log ─────────────────────────────────────────────────────────────────
const wrap  = document.getElementById('log-wrap');
const empty = document.getElementById('log-empty');
const dot   = document.getElementById('live-dot');
let since = 0;
let ytSince = 0;
let pinned = true;   // auto-scroll pinned to bottom; unpins when the user scrolls up
const ytToggle = document.getElementById('yt-toggle');
ytToggle.checked = localStorage.getItem('egm-console-yt') === '1';
ytToggle.addEventListener('change', () => {
  try { localStorage.setItem('egm-console-yt', ytToggle.checked ? '1' : '0'); } catch {}
});
const flaskToggle = document.getElementById('flask-toggle');
flaskToggle.checked = localStorage.getItem('egm-console-flask') === '1';
flaskToggle.addEventListener('change', () => {
  try { localStorage.setItem('egm-console-flask', flaskToggle.checked ? '1' : '0'); } catch {}
});

wrap.addEventListener('scroll', () => {
  pinned = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 12;
  dot.classList.toggle('paused', !pinned);
});

function classify(m) {
  const l = m.toLowerCase();
  if (l.includes('error') || l.includes('failed')) return 'err';
  if (l.includes('complete') || l.includes('available') || l.startsWith('ok')) return 'okc';
  return '';
}

function appendLines(entries, extraClass) {
  if (!entries || !entries.length) return;
  if (empty.parentNode) empty.remove();
  const frag = document.createDocumentFragment();
  for (const e of entries) {
    const div = document.createElement('div');
    div.className = 'log-line ' + (extraClass || classify(e.m));
    const t = document.createElement('span'); t.className = 'lt'; t.textContent = e.t;
    div.appendChild(t);
    div.appendChild(document.createTextNode(e.m));
    frag.appendChild(div);
  }
  wrap.appendChild(frag);
  // cap DOM so a long-open window never balloons (3x ring: diag + yt + flask streams)
  while (wrap.children.length > 2000) wrap.removeChild(wrap.firstChild);
  if (pinned) wrap.scrollTop = wrap.scrollHeight;
}

let flaskSince = 0;
async function poll() {
  try {
    const yt = ytToggle.checked ? `&yt=1&yts=${ytSince}` : '';
    const fl = flaskToggle.checked ? `&flask=1&fs=${flaskSince}` : '';
    const d = await fetch(`/api/logs?since=${since}${yt}${fl}`).then(r => r.json());
    appendLines(d.lines);
    if (ytToggle.checked && d.yt_lines) { appendLines(d.yt_lines, 'yt'); ytSince = d.yt_next ?? ytSince; }
    if (flaskToggle.checked && d.flask_lines) { appendLines(d.flask_lines, 'flask'); flaskSince = d.flask_next ?? flaskSince; }
    since = d.next ?? since;
  } catch {}
  setTimeout(poll, 1000);
}
poll();

// ── Export: full diagnostic ring (+ yt/flask rings when their toggles are on) as a file ──
document.getElementById('export-btn').addEventListener('click', async () => {
  try {
    const d = await fetch(`/api/logs?since=0&yt=1&yts=0&flask=1&fs=0`).then(r => r.json());
    const parts = (d.lines || []).map(e => `${e.t} [EGM] ${e.m}`);
    if (ytToggle.checked) {
      for (const e of (d.yt_lines || [])) parts.push(`${e.t} [yt-dlp] ${e.m}`);
    }
    if (flaskToggle.checked) {
      for (const e of (d.flask_lines || [])) parts.push(`${e.t} [flask] ${e.m}`);
    }
    const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19);
    const text = parts.join('\n') + '\n';
    const name = `egm-log-${stamp}.txt`;
    if (window.electronAPI?.saveFile) {
      // native Save As dialog (extension-aware handler routes .txt correctly)
      await window.electronAPI.saveFile(name, text);
      return;
    }
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch {}
});
</script>
</body>
</html>
