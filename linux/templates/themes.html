<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>All Themes — EGM Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:#0b1120;--surf:#111c2e;--surf2:#182338;--surf3:#1e2d47;
      --border:#243454;--border2:#2d4068;--acc:#3b82f6;--acc-h:#60a5fa;
      --text:#e2e8f6;--text2:#8faecf;--muted:#3d5470;
      --acc-dim:rgba(59,130,246,.14);
      --r:10px;--rs:7px;
    }
    {% include 'theme_styles.html' %}

    body {
      font-family:'Segoe UI',system-ui,sans-serif;
      background:var(--bg);color:var(--text);
      height:100vh;display:flex;flex-direction:column;overflow:hidden;
      transition:background .2s,color .2s;
      -webkit-app-region:no-drag;
    }

    /* ── Topbar ── */
    .topbar {
      display:flex;align-items:center;gap:10px;padding:9px 14px;
      background:var(--surf);border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:10;-webkit-app-region:drag;
      flex-shrink:0;
    }
    .topbar-title { font-size:.9rem;font-weight:600;color:var(--text);flex:1; }

    .search-wrap {
      position:relative;display:flex;align-items:center;
      -webkit-app-region:no-drag;
    }
    .search-icon {
      /* lint-allow-muted: decorative-icon */
      position:absolute;left:8px;font-size:.7rem;color:var(--muted);
      pointer-events:none;line-height:1;
    }
    input[type=search] {
      background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);
      color:var(--text);font-size:.7rem;padding:5px 10px 5px 24px;
      width:140px;outline:none;transition:width .15s,border-color .15s;height:28px;
    }
    input[type=search]:focus { border-color:var(--acc);width:200px; }
    input[type=search]::placeholder { color:var(--text2); opacity:0.55; }

    /* ── Body row: sidebar + grid ── */
    .body-row {
      display:flex;flex:1;min-height:0;overflow:hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width:135px;flex-shrink:0;
      background:var(--surf);border-right:1px solid var(--border);
      position:relative;z-index:1;
      display:flex;flex-direction:column;
      overflow:hidden;
    }
    .sidebar-cats {
      flex:1;overflow-y:auto;padding:8px 0;
    }

    .cat-tab {
      padding:6px 14px 6px 18px;font-size:.7rem;color:var(--text2);
      cursor:pointer;border-left:2px solid transparent;
      display:flex;align-items:center;gap:6px;user-select:none;
      transition:background .1s,color .1s,border-color .1s;
    }
    .cat-tab:hover { background:var(--surf2);color:var(--text); }
    .cat-tab.active {
      background:var(--acc-dim);color:var(--acc);
      border-left-color:var(--acc);font-weight:500;
    }
    .cat-tab.all-tab { font-weight:600; }
    /* lint-allow-muted: supplementary-metadata */
    .cat-count {
      margin-left:auto;font-size:.55rem;color:var(--text2);opacity:0.7;font-weight:400;
    }
    .cat-tab.active .cat-count { color:var(--acc); opacity:1; }

    .cat-section {
      font-size:.55rem;color:var(--acc);opacity:0.7;letter-spacing:.1em;
      text-transform:uppercase;padding:10px 14px 4px;font-weight:600;
      display:flex;align-items:center;justify-content:space-between;
      cursor:pointer;user-select:none;
      transition:color .1s, opacity .1s;
    }
    .cat-section:hover { color:var(--acc); opacity:1; }
    .section-caret {
      font-size:.6rem;color:var(--acc);opacity:0.7;transition:transform .15s;
    }
    .cat-section.collapsed .section-caret { transform:rotate(-90deg); }

    .cat-divider { height:1px;background:var(--border);margin:6px 14px; }

    .cat-group {
      max-height:600px;overflow:hidden;
      transition:max-height .2s ease-out;
    }
    .cat-group.collapsed { max-height:0; }

    /* ── Grid area ── */
    .grid-area {
      flex:1;overflow-y:auto;position:relative;z-index:1;
    }
    .grid {
      display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
      gap:8px;padding:14px;
    }

    .theme-card {
      border:1px solid var(--border);border-radius:var(--rs);padding:8px;
      cursor:pointer;display:flex;flex-direction:column;gap:5px;
      background:var(--surf);transition:border-color .15s,transform .1s;
    }
    .theme-card:hover { border-color:var(--border2);transform:translateY(-1px); }
    .theme-card.focused { outline:2px solid var(--acc);outline-offset:1px; }
    .theme-card.applied { animation: card-pulse .3s ease; }
    @keyframes card-pulse { 0%{box-shadow:0 0 0 0 var(--acc)} 50%{box-shadow:0 0 0 4px var(--acc)} 100%{box-shadow:0 0 0 0 var(--acc)} }
    .theme-card.active {
      border-color:var(--acc);border-width:2px;
      box-shadow:0 0 0 1px var(--acc);
    }

    .swatches { display:flex;gap:2px; }
    .swatch { flex:1;height:20px;border-radius:3px; }
    .card-name {
      font-size:.68rem;color:var(--text2);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;
    }
    .theme-card.active .card-name { color:var(--acc);font-weight:500; }

    .seasonal-badge {
      font-size:.5rem;opacity:.6;margin-left:2px;
    }

    .empty {
      grid-column:1/-1;text-align:center;padding:40px;
      /* lint-allow-muted: empty-state */
      color:var(--muted);font-size:.82rem;
    }
  
    /* ── Scrollbar theming ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text2); }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">All Themes</span>
  <div style="-webkit-app-region:no-drag">
    <button id="theme-create-btn" title="Opens the Theme Creator panel in the main window" style="display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--rs);border:1px solid var(--acc);background:var(--acc-dim);color:var(--acc);font-size:.7rem;font-weight:600;cursor:pointer;height:28px">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Create
    </button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Search themes...">
  </div>
</div>

<!-- Breadcrumb bar — visible when a category is selected -->
<div id="breadcrumb-bar" style="display:none;padding:5px 14px;border-bottom:1px solid var(--border);background:var(--surf);font-size:.72rem;color:var(--text2);display:flex;align-items:center;gap:6px">
  <span id="bc-all" style="color:var(--text2);cursor:pointer;opacity:.7">All Themes</span>
  <span style="color:var(--border2);font-size:.65rem">›</span>
  <span id="bc-current" style="color:var(--acc);font-weight:500"></span>
  <span id="bc-count" style="font-size:.65rem;color:var(--text2);opacity:.6;margin-left:2px"></span>
</div>

<div class="body-row">
  <div class="sidebar" id="sidebar"></div>
  <div class="grid-area">
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
{% raw %}
// ── API token interceptor — same as main window ──────────────────────────────
(function() {
  const _t = '{% endraw %}{{ egm_token }}{% raw %}';
  const _f = window.fetch;
  window.fetch = function(url, opts) {
    if (typeof url === 'string' && url.startsWith('/api/') && _t) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers || {}, { 'X-EGM-Token': _t });
    }
    return _f.call(this, url, opts);
  };
})();
{% endraw %}{% include 'theme_data.html' %}{% raw %}

// Sidebar structure: ordered sections + categories per section
const SECTIONS = [
  { label: 'Style',         cats: ['dark', 'futuristic', 'light', 'retro', 'space'] },
  { label: 'Vibe',          cats: ['cities', 'food', 'moods', 'music', 'nature', 'sports', 'weather'] },
  { label: 'Pop Culture',   cats: ['eightbit', 'animation', 'brands', 'characters', 'consoles', 'memes', 'movies'] },
  { label: 'Heritage',      cats: ['architecture', 'decades', 'eras', 'mythology', 'puerto_rico', 'venues'] },
  { label: 'Other',         cats: ['experimental', 'os', 'custom'] },
];

const CAT_LABELS = {
  dark:'Dark', light:'Light', 
  music:'Music', nature:'Nature', cities:'Cities', moods:'Moods',
  movies:'Movies', consoles:'Consoles', characters:'Characters',
  retro:'Retro', experimental:'Experimental', seasonal:'Seasonal ✦', custom:'Imported',
  food:'Food & Drink', weather:'Weather',
  puerto_rico:'Puerto Rico 🇵🇷',
  os:'Operating Systems',
  mythology:'Mythology', architecture:'Architecture',
  sports:'Sports', decades:'Decades', memes:'Memes',
  space:'Space', eras:'Eras',
  futuristic:'Futuristic', brands:'Brands', venues:'Venues',
  eightbit:'8-Bit Era',
  animation:'Animation',
};

let currentTheme = localStorage.getItem('egm-theme') || 'void';
let favoriteThemes = new Set();
let randomOnLaunch = false;
let randomScope = 'favorites';

async function loadFavorites() {
  try {
    const s = await fetch('/api/settings').then(r => r.json());
    favoriteThemes = new Set(Array.isArray(s.favorite_themes) ? s.favorite_themes : []);
    randomOnLaunch = !!s.random_theme_on_launch;
    randomScope = s.random_theme_scope || 'favorites';
  } catch {}
}

async function saveFavorites() {
  try {
    await fetch('/api/settings/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        favorite_themes: [...favoriteThemes],
        random_theme_on_launch: randomOnLaunch,
        random_theme_scope: randomScope
      })
    });
  } catch {}
}

function toggleFavorite(key) {
  if (!/^[a-z0-9-]+$/.test(key)) return;
  if (favoriteThemes.has(key)) favoriteThemes.delete(key);
  else favoriteThemes.add(key);
  saveFavorites();
  buildSidebar();
  render();
}

// ── Seasonal visibility — same ±30d logic as main picker ─────────────────────
const SEASONAL_VISIBLE = (() => {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const doy = (mm,dd) => mm*100+dd;
  const cur = doy(m,d);
  const inRange = (s,e) => doy(s[0],s[1]) <= doy(e[0],e[1])
    ? cur >= doy(s[0],s[1]) && cur <= doy(e[0],e[1])
    : cur >= doy(s[0],s[1]) || cur <= doy(e[0],e[1]);
  const addDays = (mm,dd,days) => { const dt = new Date(y,mm-1,dd+days); return [dt.getMonth()+1,dt.getDate()]; };
  const windows = {
    valentines:   [[1,15],[3,15]],  stpatricks: [[2,15],[4,16]],
    fourthofjuly: [[6,4],[8,3]],    halloween:  [[10,1],[11,30]],
    thanksgiving: [[11,1],[12,25]], christmas:  [[11,25],[1,24]],
    newyear:      [[12,2],[1,31]],
    lunarnewyear: [[1,15],[3,15]],  carnival:     [[1,15],[3,15]],
    nowruz:       [[3,1],[4,20]],   pride:        [[6,1],[6,30]],
    midsummer:    [[6,10],[7,10]],  dayofthedead: [[10,15],[11,15]],
    midautumn:    [[8,25],[10,15]], oktoberfest:  [[9,1],[10,20]],
    kwanzaa:      [[12,20],[1,10]],
  };
  const varDates = {
    easter:   {2025:[4,20],2026:[4,5],2027:[3,28],2028:[4,16],2029:[4,1],2030:[4,21]},
    diwali:   {2025:[10,20],2026:[11,8],2027:[10,29],2028:[10,17],2029:[11,5],2030:[10,26]},
    hanukkah: {2025:[12,14],2026:[12,4],2027:[12,24],2028:[12,12],2029:[12,1],2030:[12,20]},
    eid:      {2025:[3,30],2026:[3,20],2027:[3,9],2028:[2,27],2029:[2,15],2030:[2,4]},
  };
  Object.entries(varDates).forEach(([key,dates]) => {
    const base = dates[y] || dates[y-1];
    if (base) windows[key] = [addDays(base[0],base[1],-30), addDays(base[0],base[1],30)];
  });
  const visible = new Set();
  Object.entries(windows).forEach(([key,win]) => { if (inRange(win[0],win[1])) visible.add(key); });
  return visible;
})();

let activeCat = 'all';
let searchQ   = '';

// ── Apply current theme CSS to this window ─────────────────────────────────
const ALL_THEME_KEYS = Object.keys(THEME_DATA);
function applyBodyTheme(name) {
  document.body.classList.remove(...ALL_THEME_KEYS);
  if (name && name !== 'void') document.body.classList.add(name);
}
applyBodyTheme(currentTheme);

if (window.electronAPI && window.electronAPI.onThemeChanged) {
  window.electronAPI.onThemeChanged(theme => {
    currentTheme = theme;
    applyBodyTheme(theme);
    render();
  });
}

// ── Counts per category (respects seasonal visibility) ────────────────────
function countForCat(cat) {
  if (cat === 'custom') return 0; // imported themes — none built-in
  return Object.entries(THEME_DATA).filter(([key, d]) => {
    if (d.cat !== cat) return false;
    if (cat === 'seasonal' && !SEASONAL_VISIBLE.has(key)) return false;
    return true;
  }).length;
}
function countTotal() {
  return Object.entries(THEME_DATA).filter(([key, d]) => {
    if (d.cat === 'seasonal' && !SEASONAL_VISIBLE.has(key)) return false;
    return true;
  }).length;
}

// ── Collapsed-section state (persisted in localStorage) ───────────────────
function getCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem('egm-themes-collapsed') || '[]')); }
  catch { return new Set(); }
}
function saveCollapsed(set) {
  localStorage.setItem('egm-themes-collapsed', JSON.stringify([...set]));
}

// ── Build sidebar ─────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  const collapsed = getCollapsed();

  let html = `<div class="cat-tab all-tab${activeCat === 'all' ? ' active' : ''}" data-cat="all">All<span class="cat-count">${countTotal()}</span></div>`;

  if (favoriteThemes.size > 0) {
    html += `<div class="cat-tab fav-tab${activeCat === 'favorites' ? ' active' : ''}" data-cat="favorites" style="color:var(--acc)"><span style="margin-right:4px;font-size:13px">♥</span>Favorites<span class="cat-count">${favoriteThemes.size}</span></div>`;
  }

  // Seasonal — top-level, only if any are currently visible
  const seasonalCount = Object.entries(THEME_DATA).filter(([k,d]) => d.cat === 'seasonal' && SEASONAL_VISIBLE.has(k)).length;
  if (seasonalCount > 0) {
    html += `<div class="cat-tab${activeCat === 'seasonal' ? ' active' : ''}" data-cat="seasonal"><span style="margin-right:4px;font-size:11px">✦</span>Seasonal<span class="cat-count">${seasonalCount}</span></div>`;
  }

  html += `<div class="cat-divider"></div>`;

  SECTIONS.forEach(sec => {
    const isCollapsed = collapsed.has(sec.label);
    html += `<div class="cat-section${isCollapsed ? ' collapsed' : ''}" data-section="${sec.label}">
      <span>${sec.label}</span>
      <span class="section-caret">▾</span>
    </div>`;
    html += `<div class="cat-group${isCollapsed ? ' collapsed' : ''}" data-group="${sec.label}">`;
    sec.cats.forEach(cat => {
      const count = countForCat(cat);
      html += `<div class="cat-tab${activeCat === cat ? ' active' : ''}" data-cat="${cat}">${CAT_LABELS[cat]}<span class="cat-count">${count}</span></div>`;
    });
    html += `</div>`;
  });

  // Wrap categories in scrollable container, random toggle stays fixed at bottom
  sb.innerHTML = `<div class="sidebar-cats">${html}</div>`;
  const catsDiv = sb.querySelector('.sidebar-cats');

  const randomHtml = `
    <div style="border-top:1px solid var(--border);margin-top:auto;padding:10px 14px;">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.72rem;color:var(--text2)">
        <input type="checkbox" id="random-toggle" ${randomOnLaunch ? 'checked' : ''} style="accent-color:var(--acc);cursor:pointer">
        Random on launch
      </label>
      <select id="random-scope" style="width:100%;margin-top:6px;font-size:.68rem;background:var(--surf2);border:1px solid var(--border);color:var(--text2);border-radius:4px;padding:2px 4px;outline:none;cursor:pointer${randomOnLaunch ? '' : ';opacity:0.4;pointer-events:none'}">
        <option value="favorites" ${randomScope === 'favorites' ? 'selected' : ''}>Favorites only</option>
        <option value="all" ${randomScope === 'all' ? 'selected' : ''}>All themes</option>
      </select>
    </div>`;
  sb.insertAdjacentHTML('beforeend', randomHtml);

  document.getElementById('random-toggle').addEventListener('change', (e) => {
    randomOnLaunch = e.target.checked;
    const scope = document.getElementById('random-scope');
    scope.style.opacity = randomOnLaunch ? '1' : '0.4';
    scope.style.pointerEvents = randomOnLaunch ? '' : 'none';
    saveFavorites();
  });
  document.getElementById('random-scope').addEventListener('change', (e) => {
    randomScope = e.target.value;
    saveFavorites();
  });

  // Wire category clicks
  catsDiv.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeCat = tab.dataset.cat;
      sb.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      render();
      updateBreadcrumb();
    });
  });

  // Wire section collapse toggles
  sb.querySelectorAll('.cat-section').forEach(sec => {
    sec.addEventListener('click', () => {
      const label = sec.dataset.section;
      const group = sb.querySelector(`.cat-group[data-group="${label}"]`);
      const cur = getCollapsed();
      if (cur.has(label)) {
        cur.delete(label);
        sec.classList.remove('collapsed');
        if (group) group.classList.remove('collapsed');
      } else {
        cur.add(label);
        sec.classList.add('collapsed');
        if (group) group.classList.add('collapsed');
      }
      saveCollapsed(cur);
    });
  });
}

// ── Search ────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase();
  render();
  updateBreadcrumb();
});

// ── Open Theme Creator — the Creator is now a docked panel in the MAIN window.
// Signal main to open it via a shared-origin localStorage flag (storage events fire
// across same-origin windows — no IPC), then close this Themes window. ─────────────
document.getElementById('theme-create-btn').addEventListener('click', () => {
  try { localStorage.setItem('egm-open-creator', String(Date.now())); } catch {}
  window.close();
});

// ── Breadcrumb ────────────────────────────────────────────────────────────
function updateBreadcrumb() {
  const bar     = document.getElementById('breadcrumb-bar');
  const bcCur   = document.getElementById('bc-current');
  const bcCount = document.getElementById('bc-count');
  if (activeCat === 'all' && !searchQ) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  if (searchQ) {
    const hits = Object.values(THEME_DATA).filter(d =>
      d.label.toLowerCase().includes(searchQ) || Object.keys(THEME_DATA).find(k => THEME_DATA[k] === d && k.includes(searchQ))
    ).length;
    bcCur.textContent   = `"${searchQ}"`;
    bcCount.textContent = `${hits} result${hits !== 1 ? 's' : ''}`;
  } else {
    const label = CAT_LABELS[activeCat] || activeCat;
    const count = Object.values(THEME_DATA).filter(d => d.cat === activeCat).length;
    bcCur.textContent   = label;
    bcCount.textContent = `${count} theme${count !== 1 ? 's' : ''}`;
  }
}

document.getElementById('bc-all').addEventListener('click', () => {
  activeCat = 'all';
  searchQ   = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  const allTab = document.querySelector('.cat-tab.all-tab');
  if (allTab) allTab.classList.add('active');
  render();
  updateBreadcrumb();
});

// ── Render grid ───────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('grid');
  const entries = Object.entries(THEME_DATA).filter(([key, d]) => {
    if (d.cat === 'seasonal' && !SEASONAL_VISIBLE.has(key)) return false;
    if (activeCat === 'favorites') return favoriteThemes.has(key);
    if (activeCat !== 'all' && d.cat !== activeCat) return false;
    if (searchQ && !d.label.toLowerCase().includes(searchQ) && !key.includes(searchQ)) return false;
    return true;
  }).sort((a, b) => a[1].label.localeCompare(b[1].label));

  if (!entries.length) {
    grid.innerHTML = activeCat === 'favorites'
      ? '<div class="empty">No favorites yet — click the heart on any theme to add it.</div>'
      : '<div class="empty">No themes match your search.</div>';
    return;
  }

  grid.innerHTML = entries.map(([key, d]) => `
    <div class="theme-card${key === currentTheme ? ' active' : ''}" data-theme="${key}">
      <div class="swatches">
        <div class="swatch" style="background:${d.bg}"></div>
        <div class="swatch" style="background:${d.surf}"></div>
        <div class="swatch" style="background:${d.acc}"></div>
      </div>
      <span class="card-name">${d.label}${d.cat === 'seasonal' ? '<span class="seasonal-badge">✦</span>' : ''}</span>
      <span class="fav-heart" data-fav="${key}" title="${favoriteThemes.has(key) ? 'Remove from favorites' : 'Add to favorites'}" style="font-size:14px;cursor:pointer;margin-left:auto;color:${favoriteThemes.has(key) ? 'var(--acc)' : 'var(--text2)'};opacity:${favoriteThemes.has(key) ? '1' : '0.4'}">${favoriteThemes.has(key) ? '♥' : '♡'}</span>
    </div>
  `).join('');

  grid.querySelectorAll('.theme-card').forEach((card, i) => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.fav-heart')) return;
      focusedIdx = i;
      const theme = card.dataset.theme;
      currentTheme = theme;
      localStorage.setItem('egm-theme', theme);
      applyBodyTheme(theme);
      if (window.electronAPI && window.electronAPI.setTheme) {
        window.electronAPI.setTheme(theme);
      }
      render();
    });
  });

  grid.querySelectorAll('.fav-heart').forEach(heart => {
    heart.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(heart.dataset.fav);
    });
  });

  grid.querySelectorAll('.theme-card').forEach(card => {
    card.addEventListener('dblclick', (e) => {
      if (e.target.closest('.fav-heart')) return;
      toggleFavorite(card.dataset.theme);
    });
  });
}

// ── Keyboard navigation ──────────────────────────────────────────────────────
let focusedIdx = -1;

function updateFocus(cards, idx) {
  cards.forEach(c => c.classList.remove('focused'));
  if (idx >= 0 && idx < cards.length) {
    focusedIdx = idx;
    cards[idx].classList.add('focused');
    cards[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

document.addEventListener('keydown', (e) => {
  // Don't capture when search is focused
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

  const cards = [...document.querySelectorAll('.theme-card')];
  if (!cards.length) return;

  // Calculate columns from actual rendered positions
  const firstTop = cards[0].offsetTop;
  let cols = cards.length;
  for (let i = 1; i < cards.length; i++) {
    if (cards[i].offsetTop !== firstTop) { cols = i; break; }
  }

  if (e.key === 'ArrowRight') {
    e.preventDefault();
    updateFocus(cards, Math.min(focusedIdx + 1, cards.length - 1));
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    updateFocus(cards, Math.max(focusedIdx - 1, 0));
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    updateFocus(cards, Math.min(focusedIdx + cols, cards.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    updateFocus(cards, Math.max(focusedIdx - cols, 0));
  } else if (e.key === 'Enter' && focusedIdx >= 0) {
    e.preventDefault();
    cards[focusedIdx].click();
    cards[focusedIdx].classList.add('applied');
    setTimeout(() => cards[focusedIdx]?.classList.remove('applied'), 300);
  } else if ((e.key === 'f' || e.key === 'F') && focusedIdx >= 0) {
    e.preventDefault();
    toggleFavorite(cards[focusedIdx].dataset.theme);
  } else if (e.key === 'Escape') {
    const search = document.getElementById('search');
    if (search.value) {
      e.preventDefault();
      search.value = '';
      searchQ = '';
      render();
    }
  }
});

loadFavorites().then(() => {
  buildSidebar();
  render();
});
